<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tribal ring background -->
  <circle cx="32" cy="32" r="30" fill="url(#gradient)" stroke="url(#borderGradient)" stroke-width="2"/>
  
  <!-- Inner tribal pattern -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- Dumbbell icon in center -->
  <g transform="translate(32, 32)">
    <!-- Dumbbell bars -->
    <rect x="-12" y="-2" width="24" height="4" fill="white" rx="2"/>
    
    <!-- Left weight -->
    <rect x="-16" y="-6" width="6" height="12" fill="white" rx="3"/>
    
    <!-- Right weight -->
    <rect x="10" y="-6" width="6" height="12" fill="white" rx="3"/>
    
    <!-- Center grip -->
    <rect x="-4" y="-3" width="8" height="6" fill="rgba(255,255,255,0.8)" rx="1"/>
  </g>
  
  <!-- Tribal dots around the circle -->
  <circle cx="32" cy="8" r="2" fill="white" opacity="0.6"/>
  <circle cx="56" cy="32" r="2" fill="white" opacity="0.6"/>
  <circle cx="32" cy="56" r="2" fill="white" opacity="0.6"/>
  <circle cx="8" cy="32" r="2" fill="white" opacity="0.6"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B89FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF7A59;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B89FF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF7A59;stop-opacity:0.8" />
    </linearGradient>
  </defs>
</svg>