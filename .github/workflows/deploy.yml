name: Deploy TribeFit\n\non:\n  push:\n    branches: [ main ]\n  pull_request:\n    branches: [ main ]\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    \n    steps:\n    - name: Checkout code\n      uses: actions/checkout@v4\n      \n    - name: Setup Node.js\n      uses: actions/setup-node@v4\n      with:\n        node-version: '18'\n        cache: 'yarn'\n        \n    - name: Install dependencies\n      run: yarn install --frozen-lockfile\n      \n    - name: Create environment file\n      run: |\n        cat > .env << EOF\n        # App Configuration\n        APP_NAME=TribeFit\n        APP_DEFAULT_LOCALE=en\n        SUPPORTED_LOCALES=en,fr,ja\n        NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}\n        CORS_ORIGINS=*\n        \n        # Supabase\n        SUPABASE_URL=${{ secrets.SUPABASE_URL }}\n        SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}\n        SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}\n        \n        # Stripe\n        STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}\n        STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}\n        STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}\n        STRIPE_CONNECT_WEBHOOK_SECRET=${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET }}\n        STRIPE_CONNECT_CLIENT_ID=${{ secrets.STRIPE_CONNECT_CLIENT_ID }}\n        \n        # AdMob (Test IDs)\n        ADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713\n        ADMOB_REWARDED_UNIT_ID=ca-app-pub-3940256099942544/5224354917\n        \n        # Push Notifications (Optional)\n        FCM_SERVER_KEY=${{ secrets.FCM_SERVER_KEY }}\n        FCM_SENDER_ID=${{ secrets.FCM_SENDER_ID }}\n        \n        # Feature Flags\n        FEATURE_REP_AI_ONDEVICE=true\n        FEATURE_REP_AI_CLOUD=false\n        FEATURE_FORM_CUES_V1=false\n        FEATURE_ADS_REAL=false\n        FEATURE_PUSH_REAL=false\n        FEATURE_SNITCH_MODE=true\n        FEATURE_PACT_WALLET=true\n        FEATURE_COACH_MARKETPLACE=true\n        FEATURE_STREAMING_WORKOUTS=false\n        \n        # TribeCoins Configuration\n        COIN_USD_PEG=1.0\n        SKIP_FEE_TC=100\n        TOPUP_PACKS_TC=100,500,1000\n        \n        # Security\n        JWT_SECRET=${{ secrets.JWT_SECRET }}\n        WEBHOOK_SECRET=${{ secrets.WEBHOOK_SECRET }}\n        \n        # Analytics & Monitoring (Optional)\n        SENTRY_DSN=${{ secrets.SENTRY_DSN }}\n        ANALYTICS_ID=${{ secrets.ANALYTICS_ID }}\n        EOF\n        \n    - name: Type check\n      run: yarn build\n      \n    - name: Run tests\n      run: |\n        # Test API endpoints are accessible\n        yarn start &\n        sleep 10\n        curl -f http://localhost:3000/api/user/current || exit 1\n        curl -f http://localhost:3000/api/pact/wallet?tribe_id=test || exit 1\n        \n  deploy:\n    needs: test\n    runs-on: ubuntu-latest\n    if: github.ref == 'refs/heads/main'\n    \n    steps:\n    - name: Checkout code\n      uses: actions/checkout@v4\n      \n    - name: Setup Node.js\n      uses: actions/setup-node@v4\n      with:\n        node-version: '18'\n        cache: 'yarn'\n        \n    - name: Install dependencies\n      run: yarn install --frozen-lockfile\n      \n    - name: Create production environment file\n      run: |\n        cat > .env << EOF\n        # Production Configuration\n        APP_NAME=TribeFit\n        APP_DEFAULT_LOCALE=en\n        SUPPORTED_LOCALES=en,fr,ja\n        NEXT_PUBLIC_BASE_URL=${{ secrets.PRODUCTION_BASE_URL }}\n        CORS_ORIGINS=${{ secrets.PRODUCTION_CORS_ORIGINS }}\n        \n        # Production Supabase\n        SUPABASE_URL=${{ secrets.PRODUCTION_SUPABASE_URL }}\n        SUPABASE_ANON_KEY=${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}\n        SUPABASE_SERVICE_ROLE_KEY=${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}\n        \n        # Production Stripe\n        STRIPE_PUBLISHABLE_KEY=${{ secrets.PRODUCTION_STRIPE_PUBLISHABLE_KEY }}\n        STRIPE_SECRET_KEY=${{ secrets.PRODUCTION_STRIPE_SECRET_KEY }}\n        STRIPE_WEBHOOK_SECRET=${{ secrets.PRODUCTION_STRIPE_WEBHOOK_SECRET }}\n        STRIPE_CONNECT_WEBHOOK_SECRET=${{ secrets.PRODUCTION_STRIPE_CONNECT_WEBHOOK_SECRET }}\n        STRIPE_CONNECT_CLIENT_ID=${{ secrets.PRODUCTION_STRIPE_CONNECT_CLIENT_ID }}\n        \n        # Production AdMob\n        ADMOB_APP_ID=${{ secrets.PRODUCTION_ADMOB_APP_ID }}\n        ADMOB_REWARDED_UNIT_ID=${{ secrets.PRODUCTION_ADMOB_REWARDED_UNIT_ID }}\n        \n        # Production Push Notifications\n        FCM_SERVER_KEY=${{ secrets.PRODUCTION_FCM_SERVER_KEY }}\n        FCM_SENDER_ID=${{ secrets.PRODUCTION_FCM_SENDER_ID }}\n        \n        # Production Feature Flags\n        FEATURE_REP_AI_ONDEVICE=true\n        FEATURE_REP_AI_CLOUD=${{ secrets.FEATURE_REP_AI_CLOUD }}\n        FEATURE_FORM_CUES_V1=${{ secrets.FEATURE_FORM_CUES_V1 }}\n        FEATURE_ADS_REAL=${{ secrets.FEATURE_ADS_REAL }}\n        FEATURE_PUSH_REAL=${{ secrets.FEATURE_PUSH_REAL }}\n        FEATURE_SNITCH_MODE=true\n        FEATURE_PACT_WALLET=true\n        FEATURE_COACH_MARKETPLACE=true\n        FEATURE_STREAMING_WORKOUTS=${{ secrets.FEATURE_STREAMING_WORKOUTS }}\n        \n        # Production TribeCoins\n        COIN_USD_PEG=1.0\n        SKIP_FEE_TC=100\n        TOPUP_PACKS_TC=100,500,1000\n        \n        # Production Security\n        JWT_SECRET=${{ secrets.PRODUCTION_JWT_SECRET }}\n        WEBHOOK_SECRET=${{ secrets.PRODUCTION_WEBHOOK_SECRET }}\n        \n        # Production Analytics\n        SENTRY_DSN=${{ secrets.PRODUCTION_SENTRY_DSN }}\n        ANALYTICS_ID=${{ secrets.PRODUCTION_ANALYTICS_ID }}\n        EOF\n        \n    - name: Build application\n      run: yarn build\n      \n    - name: Deploy to Vercel\n      uses: amondnet/vercel-action@v25\n      with:\n        vercel-token: ${{ secrets.VERCEL_TOKEN }}\n        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}\n        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}\n        vercel-args: '--prod'\n        \n    # Alternative: Deploy to your custom hosting\n    # - name: Deploy to custom hosting\n    #   run: |\n    #     # Your custom deployment commands here\n    #     # e.g., rsync, scp, docker deploy, etc.\n        \n    - name: Health check\n      run: |\n        sleep 30\n        curl -f ${{ secrets.PRODUCTION_BASE_URL }}/api/user/current || exit 1\n        echo \"Deployment successful!\""